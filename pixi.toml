[workspace]
authors = ["Bing.Guo <bing.guo@som.umaryland.edu>"]
channels = ["conda-forge", "bioconda"]
name = "empirical"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[dependencies]
python = "3.10.6.*"
ipython = "8.10.0.*"
numpy = "1.23.3.*"
pandas = "1.5.0.*"
scikit-allel = "1.3.8.*"
scipy = "1.8.0.*"
# scikit-learn = "1.0.2.*"
matplotlib = "3.6.0.*"
bcftools = "1.20.*"
bedtools = "2.31.*"
pybedtools = "0.10.0.*"
samtools = "1.20.*"
# deploid = "0.5.*"
black = "22.3.0.*"
tskit = "0.5.2.*"
# tsinfer = "0.2.3.*"
# msprime = "1.1.1.*"
python-igraph = "0.10.0.*"
# graphviz = "3.0.0.*"
# plink = "1.90b6.21.*"
cxx-compiler = "1.7.0.*"
# r-base = "4.1.3.*"
# r-devtools = "2.4.4.*"
pkg-config = "0.29.2.*"
meson = "0.63.2.*"
ninja = "1.11.*"
fastparquet = "0.8.3.*"
# pyarrow = "10.0.1.*"
zlib = "*"
openjdk = "21.*"
nextflow = "23.*"
ruff = "*"
ty = "*"
# pip = "22.0.4.*"

[pypi-dependencies]
ibdutils = { git = "https://github.com/bguo068/ibdutils", rev = "v0.1.2" }


[feature.deploid.dependencies]
make = "*"
automake = "*"
autoconf = "*"
c-compiler = "*"
cxx-compiler = "*"
cppunit = "*"
zlib = "*"
git = "*"

[environments]
deploid = ["deploid"]

[tasks]

install-deploid = "pixi run -e deploid bash bin/install_depoid.sh"
